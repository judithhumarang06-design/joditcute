<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dog Breed Finder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <style>
    :root {
      --cream: #fdf9f4;
      --bg: #f8f1e9;
      --brown: #4a2f2a;
      --pink: #efd0d3;
      --nav-pink: #f0d4d6;
      --beige: #f3e4d4;
      --lilac: #d9c8e2;
    }

    body {
      background: var(--bg);
      color: var(--brown);
      font-family: 'Poppins', sans-serif;
    }

    h1, h2, h3, .display-5, .font-serif {
      font-family: 'Playfair Display', serif;
      color: var(--brown);
    }

    .site-header {
      background: var(--cream);
      border-bottom: 1px solid #efe3d6;
      padding: 24px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .nav-btn {
      display: inline-block;
      background: var(--nav-pink);
      color: var(--brown);
      text-decoration: none;
      font-weight: 500;
      padding: 10px 22px;
      border-radius: 999px;
      margin-left: 8px;
    }

    .nav-btn:hover { background: var(--lilac); color: var(--brown); }

    .section-title {
      font-family: 'Playfair Display', serif;
      font-weight: 600;
      text-align: center;
      margin: 40px 0 24px;
    }

    .search-card {
      background: var(--pink);
      border: 0;
      border-radius: 28px;
      padding: 32px;
    }

    .result-card {
      background: var(--lilac);
      border: 0;
      border-radius: 28px;
      padding: 40px 24px;
      text-align: center;
    }

    .form-control {
      border: 0;
      background: var(--cream);
      color: var(--brown);
      padding: 12px 20px;
    }

    .form-control:focus {
      box-shadow: 0 0 0 3px rgba(74, 47, 42, .25);
      background: var(--cream);
    }

    .btn-brown {
      background: var(--brown);
      color: #fff;
      border: 2px solid var(--brown);
      font-weight: 500;
      padding: 10px 26px;
      cursor: pointer;
    }

    .btn-brown:hover { background: #38211d; color: #fff; }

    .btn-ghost {
      background: transparent;
      color: var(--brown);
      border: 2px solid var(--brown);
      font-weight: 500;
      padding: 10px 26px;
    }

    .btn-ghost:hover { background: var(--brown); color: #fff; }

    .photo-circle {
      width: 300px;
      height: 300px;
      background: var(--cream);
      border: 6px solid var(--cream);
    }

    .tag {
      display: inline-block;
      background: var(--cream);
      color: var(--brown);
      font-size: .85rem;
      padding: 6px 16px;
      border-radius: 999px;
      margin: 4px 3px;
    }

    a { color: var(--brown); }

    footer {
      text-align: center;
      padding: 32px 0;
      color: var(--brown);
    }
  </style>
</head>

<body>
  <header class="site-header">
    <a href="index.html#featured" class="nav-btn">&larr; Back</a>
    <div>
    <a href="index.html#home" class="nav-btn">Home</a>
    <a href="index.html#about" class="nav-btn">About</a>
    <a href="index.html#featured" class="nav-btn">Projects</a>
    <a href="index.html#life-lately" class="nav-btn">Life Lately</a>
    <a href="index.html#contacts" class="nav-btn">Contacts</a>
    </div>
  </header>

  <div class="container">
    <h2 class="section-title">Dog Breed Finder</h2>

    <div class="row justify-content-center mb-4">
      <div class="col-lg-8">
        <div class="search-card">
          <div class="d-flex flex-row">
            <input type="text" list="breedList" placeholder="Dog breed (e.g. husky, corgi, golden retriever)"
              class="form-control rounded-start-pill" id="searchInput">
            <datalist id="breedList"></datalist>
            <button class="btn btn-brown rounded-end-pill" onclick="getDog()">Search</button>
          </div>
          <div class="text-center mt-3">
            <a href="p3list.html">View all breeds</a>
          </div>
        </div>
      </div>
    </div>

    <div class="row justify-content-center mb-5">
      <div class="col-lg-8">
        <div class="result-card">
          <div class="mx-auto rounded-circle overflow-hidden photo-circle">
            <img id="image" src="" alt="" style="width: 300px; height: 300px; object-fit: cover;" class="mx-auto">
          </div>
          <div class="h3 mt-4 display-5" id="name">Search for a breed!</div>
          <div id="subBreeds"></div>
          <div>
            <button class="btn btn-ghost rounded-pill mt-4" id="anotherBtn" style="display: none;"
              onclick="getDog()">Another photo</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <p>Humarang, Judith M. (BSIT 3-2)</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script>
    var elName = document.getElementById("name");
    var elImage = document.getElementById("image");
    var elSearch = document.getElementById("searchInput");
    var elSubs = document.getElementById("subBreeds");
    var elList = document.getElementById("breedList");
    var elAnother = document.getElementById("anotherBtn");

    var allBreeds = {};

    function capitalizeFirstLetter(str) {
      if (!str) return str;
      return str.charAt(0).toUpperCase() + str.slice(1);
    }

    const loadBreeds = async () => {
      const response = await fetch('https://dog.ceo/api/breeds/list/all');
      const data = await response.json();
      allBreeds = data.message;

      Object.keys(allBreeds).forEach(breed => {
        elList.innerHTML += '<option value="' + breed + '">';
      });
    }

    const getDog = async () => {
      const input = elSearch.value.trim().toLowerCase();
      if (!input) return;

      const words = input.split(/\s+/);
      const path = words.length === 2 ? words[1] + '/' + words[0] : words[0];

      const response = await fetch('https://dog.ceo/api/breed/' + path + '/images/random');
      const data = await response.json();

      if (data.status !== 'success') {
        elName.innerHTML = 'Breed not found';
        elImage.src = '';
        elSubs.innerHTML = '';
        elAnother.style.display = 'none';
        return;
      }

      elImage.src = data.message;
      elName.innerHTML = words.map(capitalizeFirstLetter).join(' ');
      elAnother.style.display = 'inline-block';

      const subs = words.length === 1 ? (allBreeds[words[0]] || []) : [];
      elSubs.innerHTML = subs.map(s =>
        '<span class="tag">' + capitalizeFirstLetter(s) + '</span>'
      ).join('');
    }

    elSearch.addEventListener('keydown', e => {
      if (e.key === 'Enter') getDog();
    });

    const urlParams = new URLSearchParams(window.location.search);
    loadBreeds().then(() => {
      const breed = urlParams.get('breed');
      if (breed) {
        elSearch.value = breed;
        getDog();
      }
    });
  </script>
</body>

</html>
