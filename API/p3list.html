<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dog Breeds List</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <style>
    :root {
      --cream: #fdf9f4;
      --bg: #f8f1e9;
      --brown: #4a2f2a;
      --pink: #efd0d3;
      --nav-pink: #f0d4d6;
      --beige: #f3e4d4;
      --lilac: #d9c8e2;
    }

    body {
      background: var(--bg);
      color: var(--brown);
      font-family: 'Poppins', sans-serif;
    }

    .site-header {
      background: var(--cream);
      border-bottom: 1px solid #efe3d6;
      padding: 24px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .nav-btn {
      display: inline-block;
      background: var(--nav-pink);
      color: var(--brown);
      text-decoration: none;
      font-weight: 500;
      padding: 10px 22px;
      border-radius: 999px;
      margin-left: 8px;
    }

    .nav-btn:hover { background: var(--lilac); color: var(--brown); }

    .section-title {
      font-family: 'Playfair Display', serif;
      font-weight: 600;
      text-align: center;
      color: var(--brown);
      margin: 40px 0 24px;
    }

    .page-link {
      background: var(--cream);
      color: var(--brown);
      border: 0;
      margin: 0 4px;
      border-radius: 999px !important;
      padding: 8px 20px;
      font-weight: 500;
    }

    .page-link:hover { background: var(--lilac); color: var(--brown); }

    .pagination { justify-content: center; }

    .breed-card {
      border: 0;
      border-radius: 28px;
      padding: 24px;
      box-shadow: none;
      cursor: pointer;
      transition: transform .15s ease;
    }

    .breed-card:hover { transform: translateY(-3px); }

    .breed-card.c0 { background: var(--pink); }
    .breed-card.c1 { background: var(--beige); }
    .breed-card.c2 { background: var(--lilac); }

    .breed-name {
      font-family: 'Playfair Display', serif;
      font-weight: 600;
      color: var(--brown);
    }

    .sub-pill {
      background: var(--cream);
      color: var(--brown);
      border-radius: 999px;
      padding: 6px 18px;
      font-size: .9rem;
    }

    .breed-img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border: 4px solid var(--cream);
    }

    /* Details popup */
    .breed-modal .modal-content {
      background: var(--cream);
      color: var(--brown);
      border: 0;
      border-radius: 28px;
      padding: 8px;
    }

    .breed-modal .modal-title {
      font-family: 'Playfair Display', serif;
      font-weight: 600;
      font-size: 2rem;
    }

    .modal-img {
      width: 220px;
      height: 220px;
      object-fit: cover;
      border: 6px solid var(--lilac);
    }

    .modal-tag {
      display: inline-block;
      background: var(--beige);
      color: var(--brown);
      font-size: .85rem;
      padding: 6px 16px;
      border-radius: 999px;
      margin: 4px 3px;
    }

    .def-box {
      background: var(--bg);
      border-radius: 20px;
      padding: 16px 20px;
      font-size: .95rem;
      line-height: 1.6;
      text-align: left;
    }

    .def-label {
      font-weight: 600;
      text-transform: uppercase;
      font-size: .75rem;
      letter-spacing: .08em;
      margin-bottom: 6px;
    }

    .btn-brown {
      background: var(--brown);
      color: #fff;
      border: 2px solid var(--brown);
      font-weight: 500;
      padding: 10px 26px;
    }

    .btn-brown:hover { background: #38211d; color: #fff; }

    footer {
      text-align: center;
      padding: 32px 0;
      color: var(--brown);
    }
  </style>
</head>

<body>
  <header class="site-header">
    <a href="project3.html" class="nav-btn">&larr; Back</a>
    <div>
    <a href="index.html#home" class="nav-btn">Home</a>
    <a href="index.html#about" class="nav-btn">About</a>
    <a href="index.html#featured" class="nav-btn">Projects</a>
    <a href="index.html#life-lately" class="nav-btn">Life Lately</a>
    <a href="index.html#contacts" class="nav-btn">Contacts</a>
    </div>
  </header>

  <h2 class="section-title">Dog Breeds</h2>

  <div class="container">
    <nav aria-label="Page navigation">
      <ul class="pagination">
        <li class="page-item"><a class="page-link" style="cursor: pointer;" onclick="prev()">Previous</a></li>
        <li class="page-item"><a class="page-link" id="currentPage">1</a></li>
        <li class="page-item"><a class="page-link" style="cursor: pointer;" onclick="next()">Next</a></li>
      </ul>
    </nav>
  </div>

  <div class="container">
    <div class="row" id="parent"></div>
  </div>

  <!-- Breed details popup -->
  <div class="modal fade breed-modal" id="breedModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header border-0 pb-0">
          <h3 class="modal-title" id="modalName"></h3>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body text-center">
          <img id="modalImage" src="" alt="" class="rounded-circle modal-img mb-3">
          <div id="modalSubs" class="mb-3"></div>
          <div class="def-box">
            <div class="def-label">Details</div>
            <div id="modalDef"></div>
          </div>
        </div>
        <div class="modal-footer border-0 pt-0 justify-content-center">
          <a id="modalLink" class="btn btn-brown rounded-pill" href="#">See more photos</a>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <p>Humarang, Judith M. (BSIT 3-2)</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script>
    function capitalizeFirstLetter(str) {
      if (!str) return str;
      return str.charAt(0).toUpperCase() + str.slice(1);
    }

    const urlParams = new URLSearchParams(window.location.search);

    var page = Number(urlParams.get('page')) || 1;

    var perPageLoad = 12;
    var breeds = {};      // { breed: [subBreeds] }
    var breedNames = [];
    var lastPage = 1;
    var imagesByName = {};
    var descBreeds = [];
    var descLoaded = false;
    var breedModal = null;

    var elParent = document.getElementById("parent");
    var elCurrentPage = document.getElementById("currentPage");

    // dogapi.dog has a description for each breed. Load all pages once.
    const loadDescriptions = async () => {
      if (descLoaded) return;
      let url = 'https://dogapi.dog/api/v2/breeds?page[number]=1';
      while (url) {
        const res = await fetch(url);
        const json = await res.json();
        json.data.forEach(b => descBreeds.push({
          name: b.attributes.name,
          description: b.attributes.description
        }));
        url = json.links && json.links.next ? json.links.next : null;
      }
      descLoaded = true;
    }

    const getDescription = async (name) => {
      const words = name.split(/\s+/);

      // 1) dogapi.dog
      try {
        await loadDescriptions();
        const match = descBreeds.find(b => {
          const n = b.name.toLowerCase();
          return words.every(w => n.includes(w));
        });
        if (match && match.description) return match.description;
      } catch (err) { }

      // 2) Wikipedia backup
      try {
        const searchUrl = 'https://en.wikipedia.org/w/api.php?action=query&list=search&format=json&origin=*&srlimit=1&srsearch='
          + encodeURIComponent(name + ' dog breed');
        const searchData = await (await fetch(searchUrl)).json();
        const hit = searchData.query.search[0];
        const sum = await (await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(hit.title))).json();
        if (sum.extract) return sum.extract;
      } catch (err) { }

      return capitalizeFirstLetter(name) + ' is a breed of dog.';
    }

    const showDetails = async (name) => {
      if (!breedModal) breedModal = new bootstrap.Modal(document.getElementById('breedModal'));

      const subs = breeds[name] || [];
      document.getElementById('modalName').innerHTML = capitalizeFirstLetter(name);
      document.getElementById('modalImage').src = imagesByName[name] || '';
      document.getElementById('modalSubs').innerHTML = subs.length > 0
        ? subs.map(s => '<span class="modal-tag">' + capitalizeFirstLetter(s) + '</span>').join('')
        : '<span class="modal-tag">No sub-breeds</span>';
      document.getElementById('modalLink').href = 'project3.html?breed=' + name;
      document.getElementById('modalDef').innerHTML = 'Loading details...';
      breedModal.show();

      document.getElementById('modalDef').innerHTML = await getDescription(name);
    }

    const loadBreeds = async () => {
      const response = await fetch('https://dog.ceo/api/breeds/list/all');
      const data = await response.json();
      breeds = data.message;
      breedNames = Object.keys(breeds);
      lastPage = Math.ceil(breedNames.length / perPageLoad);
      if (page > lastPage) page = 1;
      getDogs();
    }

    const getDogs = async () => {
      elParent.innerHTML = '';
      elCurrentPage.innerHTML = page + ' / ' + lastPage;

      const start = perPageLoad * (page - 1);
      const pageBreeds = breedNames.slice(start, start + perPageLoad);

      const images = await Promise.all(pageBreeds.map(async name => {
        const response = await fetch('https://dog.ceo/api/breed/' + name + '/images/random');
        const data = await response.json();
        return data.message;
      }));

      pageBreeds.forEach((name, i) => {
        imagesByName[name] = images[i];
        const subs = breeds[name];
        const subText = subs.length > 0 ? subs.length + ' sub-breed' + (subs.length > 1 ? 's' : '') : 'No sub-breeds';
        const colorClass = 'c' + (i % 3);

        elParent.innerHTML += `
          <div class="col-12 col-md-6">
            <div class="card breed-card ${colorClass} my-2 d-flex flex-row align-items-center"
              onclick="showDetails('` + name + `')">
              <img class="rounded-circle breed-img" src="` + images[i] + `" alt="` + name + `">
              <div class="mx-4 h4 m-0 breed-name">` + capitalizeFirstLetter(name) + `</div>
              <div class="sub-pill ms-auto">` + subText + `</div>
            </div>
          </div>
        `;
      });
    }

    function prev() {
      page -= 1;
      if (page == 0) {
        page = lastPage;
      }
      getDogs();
    }

    function next() {
      page += 1;
      if (page > lastPage) {
        page = 1;
      }
      getDogs();
    }

    loadBreeds();
  </script>
</body>

</html>
