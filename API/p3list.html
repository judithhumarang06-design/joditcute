<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dog Breeds List</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
  <div class="container-fluid bg-warning shadow mb-3">
    <div class="row">
      <div class="col">
        <div class="text-center display-6 text-dark py-3">🐕 Dog Breeds</div>
      </div>
    </div>
  </div>

  <div class="container">
    <nav aria-label="Page navigation">
      <ul class="pagination">
        <li class="page-item"><a class="page-link" style="cursor: pointer;" onclick="prev()">Previous</a></li>
        <li class="page-item"><a class="page-link" id="currentPage">1</a></li>
        <li class="page-item"><a class="page-link" style="cursor: pointer;" onclick="next()">Next</a></li>
      </ul>
    </nav>
  </div>

  <div class="container">
    <div class="row" id="parent"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script>
    function capitalizeFirstLetter(str) {
      if (!str) return str;
      return str.charAt(0).toUpperCase() + str.slice(1);
    }

    const urlParams = new URLSearchParams(window.location.search);

    // Number() is important: URL params are strings, so "1" + 1 would become "11"
    var page = Number(urlParams.get('page')) || 1;

    var perPageLoad = 12;
    var breeds = {};      // { breed: [subBreeds] }
    var breedNames = [];
    var lastPage = 1;

    var elParent = document.getElementById("parent");
    var elCurrentPage = document.getElementById("currentPage");

    const loadBreeds = async () => {
      const response = await fetch('https://dog.ceo/api/breeds/list/all');
      const data = await response.json();
      breeds = data.message;
      breedNames = Object.keys(breeds);
      lastPage = Math.ceil(breedNames.length / perPageLoad);
      if (page > lastPage) page = 1;
      getDogs();
    }

    const getDogs = async () => {
      elParent.innerHTML = '';
      elCurrentPage.innerHTML = page + ' / ' + lastPage;

      const start = perPageLoad * (page - 1);
      const pageBreeds = breedNames.slice(start, start + perPageLoad);

      // Fetch all images of this page at the same time (faster than one by one)
      const images = await Promise.all(pageBreeds.map(async name => {
        const response = await fetch('https://dog.ceo/api/breed/' + name + '/images/random');
        const data = await response.json();
        return data.message;
      }));

      pageBreeds.forEach((name, i) => {
        const subs = breeds[name];
        const subText = subs.length > 0 ? subs.length + ' sub-breed' + (subs.length > 1 ? 's' : '') : 'No sub-breeds';

        elParent.innerHTML += `
          <div class="col-12">
            <div class="card my-3 shadow-sm p-4 d-flex flex-row align-items-center">
              <img class="rounded-circle" style="width: 80px; height: 80px; object-fit: cover;" src="` + images[i] + `">
              <div class="mx-4 h4 m-0">
                <a style="text-decoration: none" href="index.html?breed=` + name + `">` + capitalizeFirstLetter(name) + `</a>
              </div>
              <div class="rounded-pill px-4 bg-warning-subtle">` + subText + `</div>
            </div>
          </div>
        `;
      });
    }

    function prev() {
      page -= 1;
      if (page == 0) {
        page = lastPage;
      }
      getDogs();
    }

    function next() {
      page += 1;
      if (page > lastPage) {
        page = 1;
      }
      getDogs();
    }

    loadBreeds();
  </script>
</body>

</html>
